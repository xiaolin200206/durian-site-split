name: verify claims

# Every number in the paper is recomputed from results/ on each push.
# A figure edited in the manuscript without re-deriving it fails here.

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - run: python verify_claims.py --verbose
